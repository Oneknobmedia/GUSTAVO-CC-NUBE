<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* Plantilla de colección estilo Shopify "Ecomus": barra de aviso, cabecera con buscador, menú de categorías, cinta animada, banner redondeado, barra Filtrar / columnas / orden, grilla de tarjetas con insignia circular y etiquetas, footer en 4 columnas y barra inferior fija en móvil. */
:root{--bg:#f5f5f7;--fg:#1d1d1f;--mut:#6e6e73;--line:#d9d9de;--card:#ffffff;--accent:#4d5cf9;--sale:#ff463b;--ph:#e5e5e5;--dark:#1d1d1f;--flash:#43b99f;--exp:#aeb4bd;--r:16px;--wrap:1240px;--bar:62px;--font:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--font);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mq-in{animation:none!important}}

/* aviso y cabecera */
.ann{background:var(--dark);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:11px 16px;line-height:1.3}
.ann:empty{display:none}
.hd{position:sticky;top:0;z-index:30;background:var(--bg);transition:box-shadow .2s}
.hd.sc{box-shadow:0 6px 18px -12px rgba(0,0,0,.3)}
.hd-row{display:flex;align-items:center;gap:20px;min-height:80px}
.logo{display:flex;flex-direction:column;line-height:1;flex:none;max-width:260px}
.logo img{max-height:52px;width:auto}
.logo b{font-size:30px;font-weight:700;letter-spacing:-.04em}
.logo b i{color:var(--accent);font-style:normal}
.logo small{font-size:14px;font-weight:700;margin-top:3px}
.srch{flex:1;max-width:400px;margin-left:auto;display:flex;align-items:center;border:1px solid var(--fg);border-radius:12px;padding:4px 4px 4px 20px;background:var(--card)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;height:36px}
.srch button{background:var(--dark);color:#fff;border-radius:10px;width:72px;height:36px;display:grid;place-items:center}
.ico{display:flex;align-items:center;gap:22px}
.ib{display:flex;align-items:center;gap:6px;font-size:16px;position:relative}
.ib .n{position:absolute;top:-8px;left:12px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.ib.cart{padding-left:20px;border-left:1px solid var(--line)}
.ib.cart svg{width:30px;height:30px}
.ib.cart .n{left:auto;right:-8px;top:-10px}
.burg,.m-only{display:none}
.nav{display:flex;flex-wrap:wrap;gap:4px 28px;padding:6px 0 18px}
.nav button{display:flex;align-items:center;gap:4px;text-transform:uppercase;font-size:13px;letter-spacing:.02em;padding:6px 0;border-bottom:1px solid transparent}
.nav button svg{width:12px;height:12px}
.nav button:hover,.nav button.on{border-color:var(--fg)}

/* cinta animada */
.mq{overflow:hidden;padding:20px 0;white-space:nowrap}
.mq-in{display:inline-flex;animation:mq 30s linear infinite}
.mq span{display:inline-flex;align-items:center;gap:30px;padding-right:30px;font-size:17px;text-transform:uppercase}
.mq span::before{content:"";border:5px solid transparent;border-bottom:8px solid var(--fg);border-top:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* banner y título */
.hero{margin:28px auto 0;border-radius:var(--r);overflow:hidden;background:var(--ph)}
.hero img{width:100%;height:auto}
.hero picture{display:block}
.ttl{text-align:center;font-size:21px;font-weight:400;margin:56px 0 40px}
.cdesc{text-align:center;color:var(--mut);max-width:680px;margin:-28px auto 36px}

/* barra de herramientas */
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:38px}
.pill{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border:1px solid var(--fg);border-radius:999px;font-weight:700;text-transform:uppercase;font-size:13px;background:transparent}
.pill svg{width:22px}
.cols{display:flex;gap:22px;justify-content:center}
.cols button{display:grid;gap:3px;opacity:.35;padding:4px}
.cols button.on{opacity:1}
.cols i{display:block;width:5px;height:5px;border-radius:50%;background:var(--fg)}
.cols .c1 i{width:18px;height:2px;border-radius:2px}
.sort{justify-self:end;position:relative}
.sort select{appearance:none;height:44px;border:1px solid var(--fg);border-radius:12px;background:transparent;padding:0 48px 0 18px;font-size:15px;cursor:pointer;min-width:190px}
.sort svg{position:absolute;right:16px;top:12px;pointer-events:none;width:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-22px 0 26px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--card)}
.chip svg{width:12px;height:12px}

/* grilla y tarjetas */
.grid{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:48px 24px;margin-bottom:80px}
.card{display:flex;flex-direction:column;min-width:0;position:relative}
.ph{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--ph);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;transition:transform .5s,opacity .3s}
.ph img+img{position:absolute;inset:0;opacity:0}
.card:hover .ph img+img{opacity:1}
.card:hover .ph img:only-of-type{transform:scale(1.04)}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#b7b7bc}
.ph .noimg svg{width:34%;height:34%}
.bdg{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(92px,52%);aspect-ratio:1;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.2;padding:8px;pointer-events:none}
.off{position:absolute;left:10px;top:10px;background:var(--sale);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.acts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;opacity:0;translate:8px 0;transition:.25s}
.card:hover .acts,.acts:focus-within{opacity:1;translate:0}
.acts button{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.acts button svg{width:18px}
.acts button.on{color:var(--sale)}
.acts button.on svg{fill:currentColor}
.vd{color:var(--mut);font-size:15px;margin-top:20px}
.pt{font-size:17px;font-weight:400;line-height:1.3;margin-top:10px;cursor:pointer;overflow-wrap:anywhere}
.pt:hover{text-decoration:underline}
.pr{margin-top:6px;display:flex;flex-direction:column;font-size:15px}
.pr s{color:var(--mut);font-size:14px}
.pr b{font-weight:700}
.pr .sl{color:var(--sale)}
.pls{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:14px}
.pl{display:inline-flex;align-items:center;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.02em;padding:4px 7px;border-radius:3px;color:#fff;background:var(--dark);line-height:1.2}
.pl.flash{background:var(--flash)}
.pl.exp{background:var(--exp)}
.pl.acc{background:var(--accent)}
.pl.sale{background:var(--sale)}
.pl svg{width:12px;height:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
/* vista lista */
.grid.list{grid-template-columns:1fr;gap:28px}
.grid.list .card{display:grid;grid-template-columns:minmax(140px,260px) 1fr;column-gap:28px;align-items:start}
.grid.list .ph{grid-row:1/8}
.grid.list .vd{margin-top:0}

/* footer */
.ft{border-top:1px solid var(--line);padding:70px 0 0;font-size:16px}
.ft-g{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
.ft h4{font-size:19px;font-weight:500;margin-bottom:18px}
.ft p,.ft li{color:#424245;white-space:pre-line}
.ft ul{list-style:none;display:grid;gap:10px;font-size:15px}
.ft a{text-decoration:underline;text-underline-offset:3px}
.ft ul a{text-decoration:none}
.ft ul a:hover{text-decoration:underline}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.soc a{width:34px;height:34px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;text-decoration:none}
.soc svg{width:15px;height:15px}
.news{display:flex;border:1px solid var(--fg);border-radius:14px;padding:6px;background:var(--card);margin-top:22px}
.news input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 12px}
.news button{background:var(--dark);color:#fff;border-radius:8px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-size:15px}
.news svg{width:14px}
.copy{border-top:1px solid var(--line);margin-top:60px;padding:22px 0 30px;text-align:center;color:#424245;font-size:15px}

/* flotante y barra móvil */
.fab{position:fixed;right:24px;bottom:24px;z-index:40;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.fab svg{width:28px;height:28px}
.mbar{display:none}

/* paneles */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;z-index:61;width:min(420px,92vw);background:var(--bg);display:flex;flex-direction:column;transition:transform .3s;box-shadow:0 0 30px rgba(0,0,0,.2)}
.dr.l{left:0;transform:translateX(-105%)}
.dr.r{right:0;transform:translateX(105%)}
.dr.on{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);font-size:18px;font-weight:600}
.dr-b{flex:1;overflow:auto;padding:20px 22px}
.dr-f{padding:16px 22px;border-top:1px solid var(--line);display:grid;gap:10px}
.x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.x:hover{background:var(--ph)}
.fg{border-bottom:1px solid var(--line);padding:16px 0}
.fg h5{font-size:16px;font-weight:500;margin-bottom:12px}
.fg label{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.fg input[type=checkbox]{width:18px;height:18px;accent-color:var(--fg)}
.fg .rg{display:flex;align-items:center;gap:8px}
.fg .rg input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--card)}
.btn{height:48px;border-radius:999px;background:var(--dark);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;width:100%}
.btn.wa{background:#25d366}
.btn.ln{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.ci{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ci .im{width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--ph)}
.ci .im img{width:100%;height:100%;object-fit:cover}
.ci h6{font-size:14px;font-weight:500;line-height:1.3}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;margin-top:6px}
.qty button{width:30px;height:30px;font-size:16px}
.qty span{min-width:22px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700}

/* vista rápida */
.md{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:20px;pointer-events:none}
.md>div{pointer-events:none;visibility:hidden;background:var(--bg);border-radius:var(--r);width:min(980px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;position:relative;opacity:0;transform:translateY(20px);transition:.25s}
.md.on>div{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.md .x{position:absolute;right:10px;top:10px;background:#fff;z-index:2}
.qv-g{background:var(--ph);position:relative}
.qv-g .main{aspect-ratio:1;width:100%;object-fit:cover}
.qv-t{display:flex;gap:8px;padding:10px;overflow-x:auto}
.qv-t img{width:60px;height:60px;border-radius:8px;object-fit:cover;cursor:pointer;opacity:.6;border:2px solid transparent}
.qv-t img.on{opacity:1;border-color:var(--fg)}
.qv-i{padding:34px 30px;display:flex;flex-direction:column;gap:14px}
.qv-i h2{font-size:24px;font-weight:500;line-height:1.25}
.qv-i .pr{font-size:20px;flex-direction:row;gap:12px;align-items:baseline}
.qv-i .pls{flex-direction:row;flex-wrap:wrap;margin:0}
.qv-i .ds{color:#424245;white-space:pre-line;font-size:15px}
.qv-i .row{display:flex;gap:10px;align-items:center}
.qv-i .qty{margin:0;height:48px}
.qv-i .qty button{width:44px;height:46px}
.stk{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.stk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--flash)}
.stk.no::before{background:var(--sale)}

.toast{position:fixed;left:50%;bottom:100px;translate:-50% 0;z-index:90;background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}

@media(max-width:1024px){
  .ft-g{grid-template-columns:repeat(2,1fr)}
  .ib span.t{display:none}
}
@media(max-width:768px){
  :root{--r:14px}
  .wrap{padding:0 15px}
  .ann{font-size:13px}
  .hd-row{min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
  .burg,.m-only{display:grid;place-items:center}
  .burg{justify-self:start;width:40px;height:40px}
  .burg svg{width:26px;height:26px}
  .logo{align-items:center;max-width:180px}
  .logo b{font-size:24px}
  .logo small{font-size:12px}
  .logo img{max-height:42px}
  .srch,.nav,.ico .ib:not(.cart){display:none}
  .ico{justify-self:end;gap:14px}
  .ib.cart{padding:0;border:0}
  .ib.cart svg{width:22px;height:22px}
  .mq{padding:12px 0}.mq span{font-size:15px}
  .hero{margin-top:16px}
  .ttl{margin:32px 0 26px}
  .tb{margin-bottom:24px}
  .pill{height:38px;padding:0 14px}
  .cols .cd{display:none}
  .tb{grid-template-columns:auto auto minmax(0,1fr);gap:10px}
  .cols{gap:12px}
  .sort{display:block;min-width:0;width:100%;max-width:170px}
  .sort select{min-width:0;width:100%;height:38px;font-size:14px;padding:0 34px 0 12px;text-overflow:ellipsis}
  .sort svg{top:10px;right:12px}
  .grid{gap:30px 12px}
  .grid:not(.list){--cols:2!important}
  .grid.list .card{grid-template-columns:120px 1fr;column-gap:14px}
  .bdg{font-size:13px;width:44%}
  .vd{font-size:14px;margin-top:14px}
  .pt{font-size:15px;margin-top:6px}
  .acts{display:none}
  .ft-g{grid-template-columns:1fr}
  body{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px))}
  .mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px -8px rgba(0,0,0,.2)}
  .mbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;position:relative}
  .mbar .n{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 3px}
  .fab{bottom:calc(var(--bar) + 16px + env(safe-area-inset-bottom,0px));right:16px;width:54px;height:54px}
  .md{padding:0;align-items:end}
  .md>div{grid-template-columns:1fr;border-radius:var(--r) var(--r) 0 0;max-height:94vh}
  .qv-i{padding:22px 18px 30px}
  .toast{bottom:calc(var(--bar) + 20px)}
}
/* buscador móvil */
.msr{position:fixed;left:0;right:0;top:0;z-index:63;background:var(--bg);padding:14px;display:flex;gap:8px;transform:translateY(-110%);transition:transform .25s;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.msr.on{transform:none}
.msr input{flex:1;height:44px;border:1px solid var(--fg);border-radius:12px;padding:0 14px;background:var(--card);font-size:16px}
.mnav button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:14px}
</style>
<style id="edcss">
/* editor del creador de catálogos: solo visible con el catálogo editable */
.edb{position:fixed;left:16px;bottom:16px;z-index:50;background:var(--dark);color:#fff;border-radius:999px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-weight:600;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.edb svg{width:16px;height:16px}
@media(max-width:768px){.edb{bottom:calc(var(--bar) + 16px)}}
.ed{width:min(520px,96vw)}
.ed .dr-b{padding:0}
.etabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.etabs button{padding:10px 12px;border-radius:8px 8px 0 0;font-size:14px;white-space:nowrap}
.etabs button.on{background:var(--card);font-weight:600}
.epn{padding:18px 20px;display:grid;gap:14px}
.ef{display:grid;gap:5px;font-size:13px;font-weight:600}
.ef input,.ef textarea,.ef select{font-weight:400;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);width:100%}
.ef textarea{min-height:70px;resize:vertical}
.ef input[type=color]{height:38px;padding:2px}
.ef small{font-weight:400;color:var(--mut)}
.e2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.e3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ebtns{display:flex;flex-wrap:wrap;gap:8px}
.eb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.eb.pri{background:var(--dark);color:#fff;border-color:var(--dark)}
.eb.dng{color:var(--sale)}
.eb svg{width:14px;height:14px}
.epr{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px}
.epr .im{width:84px;height:84px;border-radius:10px;background:var(--ph);overflow:hidden;position:relative;display:grid;place-items:center;cursor:pointer;color:#999}
.epr .im img{width:100%;height:100%;object-fit:cover}
.epr .im input{position:absolute;inset:0;opacity:0;cursor:pointer}
.epr .ef{font-size:12px}
.epr .ef input{padding:6px 8px;font-size:13px}
.epr .ebtns{grid-column:1/-1}
.ehint{font-size:13px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.ehint code{font-size:12px;word-break:break-all}
</style>
</head>

<div id="app"></div>

/* carrito */
function cartView() {

  b.innerHTML = cart.map(c => { const p = findP(c.id), im = imgsOf(p)[0]; tot += p.price * c.q; return `<div class="ci" data-id="${esc(p.id)}"><div class="im">${im ? `<img src="${esc(im)}" alt="">` : ''}</div><div><h6>${esc(p.title)}</h6><div style="font-weight:700">${fmt(p.price)}</div><div class="qty"><button data-a="dec" aria-label="Menos">−</button><span>${c.q}</span><button data-a="inc" aria-label="Más">+</button></div></div><button class="x" data-a="rm" aria-label="Quitar">${I.trash}</button></div>`; }).join('');

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a],[data-cat],[data-cols],[data-chip],[data-th]');
  if (!t) return;
  if (t.dataset.th != null) { const m = $('#qv .main'); m.src = t.src; $$('#qv [data-th]').forEach(x => x.classList.toggle('on', x === t)); return; }
  if (t.dataset.cat) { e.preventDefault(); close(); go({cat: t.dataset.cat, q: '', fav: false, v: [], av: '', min: '', max: ''}); $('main').scrollIntoView(); return; }
  if (t.dataset.cols) { st.cols = +t.dataset.cols; grid(); return; }
  if (t.dataset.chip) { const k = t.dataset.chip; if (k.startsWith('v:')) st.v = st.v.filter(v => v !== k.slice(2)); else st[k] = ''; grid(); return; }
  const a = t.dataset.a, id = (t.closest('[data-id]') || {}).dataset?.id;
  switch (a) {
    case 'home': e.preventDefault(); close(); go({q: '', fav: false}); scrollTo(0, 0); break;
    case 'menu': open('dmenu'); break;
    case 'filter': filters(); open('dfil'); break;
    case 'cart': cartView(); open('dcart'); break;
    case 'favs': close(); go({fav: true, q: ''}); $('main').scrollIntoView(); break;
    case 'msearch': close(); $('.msr').classList.add('on'); $('.ov').classList.add('on'); $('.msr input').focus(); break;
    case 'close': close(); break;
    case 'clear': Object.assign(st, {v: [], av: '', min: '', max: ''}); filters(); grid(); break;
    case 'qv': qv(id); break;
    case 'add': addCart(id); break;
    case 'fav': favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id]; lsSet(KEY + 'fav', favs); counts(); grid(); if ($('#qv').classList.contains('on')) qv(id); break;
    case 'inc': case 'dec': { const c = cart.find(x => x.id === id); c.q += a === 'inc' ? 1 : -1; if (c.q < 1) cart = cart.filter(x => x !== c); saveCart(); cartView(); break; }
    case 'rm': cart = cart.filter(x => x.id !== id); saveCart(); cartView(); break;
    case 'empty': cart = []; saveCart(); cartView(); break;
    case 'qi': case 'qd': { const s = $('#qv [data-q]'); s.textContent = Math.max(1, +s.textContent + (a === 'qi' ? 1 : -1)); break; }

});

    case 'addcat': { const n = {id: uid(), name: 'Nueva colección', desc: '', hero: '', heroM: '', products: []}; D.cats.push(n); ecat = n.id; go({cat: n.id}); break; }
    case 'catup': { const i = D.cats.indexOf(c); [D.cats[i - 1], D.cats[i]] = [D.cats[i], D.cats[i - 1]]; break; }
    case 'delcat': if (D.cats.length < 2) return toast('Debe quedar al menos una colección'); if (!confirm(`¿Eliminar “${c.name}” y sus ${c.products.length} productos?`)) return; D.cats = D.cats.filter(x => x !== c); ecat = D.cats[0].id; go({cat: ecat}); break;
    case 'addp': c.products.unshift({id: uid(), title: 'Nuevo producto', vendor: '', price: 0, old: 0, img: '', imgs: [], badge: '', stock: true, pills: [], desc: ''}); break;
    case 'pup': [c.products[pi - 1], c.products[pi]] = [c.products[pi], c.products[pi - 1]]; break;
    case 'pdup': c.products.splice(pi + 1, 0, Object.assign(JSON.parse(JSON.stringify(c.products[pi])), {id: uid()})); break;
    case 'pdel': if (!confirm('¿Eliminar este producto?')) return; c.products.splice(pi, 1); break;
    case 'resetTheme': D.theme = {bg: '#f5f5f7', fg: '#1d1d1f', card: '#ffffff', accent: '#4d5cf9', sale: '#ff463b', ph: '#e5e5e5', dark: '#1d1d1f', flash: '#43b99f', exp: '#aeb4bd', r: 16}; break;
    case 'imp': importShopify($('#impjson').value, $('#impname').value); return;
    case 'exp': case 'expf': exportHTML(a === 'expf'); return;
    case 'json': download(JSON.stringify(D, null, 1), slug(D.store.name) + '.json', 'application/json'); return;
    case 'drop': if (!confirm('¿Descartar el borrador y volver al catálogo guardado en el archivo?')) return; lsDel(KEY + 'draft'); location.reload(); return;
    default: return;
  }
  persist(); epanel();
});

function importShopify(txt, name) {
  let j; try { j = JSON.parse(txt); } catch (e) { return toast('El texto no es JSON válido'); }
  const ps = (j.products || (Array.isArray(j) ? j : j.product ? [j.product] : [])).filter(p => p && p.title);
  if (!ps.length) return toast('No se encontraron productos');
  const strip = h => { const d = document.createElement('div'); d.innerHTML = String(h || '').replace(/<(br|\/p|\/li|\/h\d)>/gi, '\n'); return d.textContent.replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim(); };
  const c = {id: uid(), name: (name || '').trim() || 'Colección importada', desc: '', hero: '', heroM: '', products: ps.map(p => {
    const vs = p.variants || [], v = vs.find(x => x.available) || vs[0] || {}, price = num(v.price), old = num(v.compare_at_price);
    const av = vs.some(x => x.available);
    return {id: uid(), title: p.title, vendor: p.vendor || '', price, old: old > price ? old : 0,
      img: ((p.images || [])[0] || {}).src || '', imgs: (p.images || []).slice(1, 8).map(i => i.src), badge: av ? '' : 'Bajo Pedido', stock: av, pills: [], desc: strip(p.body_html).slice(0, 1500)};
  })};
  D.cats.push(c); ecat = c.id; go({cat: c.id, q: '', fav: false}); persist(); epanel();
  toast(`${c.products.length} productos importados`);
}
function exportHTML(final) {
  const d = JSON.parse(JSON.stringify(D)); d.editable = !final; d.stamp = uid();
  d.cats.forEach(c => c.products.forEach(p => delete p._c));
  const json = JSON.stringify(d).replace(/</g, '\\u003c');
  const html = TPL.replace(/(<script id="catdata" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b).replace(/<title>[\s\S]*?<\/title>/, () => '<title>' + esc(D.store.name) + '</title>');
  download(html, slug(D.store.name) + (final ? '' : '-editable') + '.html', 'text/html');
  if (!final) { lsDel(KEY + 'draft'); }
  toast('Catálogo descargado');
}
function download(txt, name, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function readImg(file, max) {
  return new Promise((ok, ko) => { const fr = new FileReader(); fr.onerror = ko; fr.onload = () => { const im = new Image(); im.onerror = ko; im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    ok(c.toDataURL('image/webp', .82)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}

shell(); render();
})();
</script>
